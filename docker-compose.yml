services:
  redis:
    image: redis:7
    container_name: taskqueue-redis
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16
    container_name: taskqueue-postgres
    environment:
      POSTGRES_USER: taskqueue
      POSTGRES_PASSWORD: taskqueue
      POSTGRES_DB: taskqueue
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  prometheus:
    image: prom/prometheus:latest
    container_name: taskqueue-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:latest
    container_name: taskqueue-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana

  api:
    build: .
    container_name: taskqueue-api
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+psycopg2://taskqueue:taskqueue@postgres:5432/taskqueue
    depends_on:
      - redis
      - postgres
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  worker:
    build: .
    container_name: taskqueue-worker
    environment:
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+psycopg2://taskqueue:taskqueue@postgres:5432/taskqueue
    depends_on:
      - redis
      - postgres
    command: celery -A app.celery_app worker --loglevel=info -Q high,normal,low
    
volumes:
  postgres_data:
  grafana_data: